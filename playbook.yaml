---
# hybrid-vps-ansible · main playbook
#
# Configure Contabo VPS as the "VPS side" of the hybrid VPS↔AWS architecture:
#   1. Tailscale — join tailnet, accept routes to VPC 10.230.0.0/16
#   2. ECS Anywhere agent — register as container instance in cluster hybrid-apis
#   3. Traefik multi-network — add Docker default `bridge` to Traefik's network list
#
# Usage:
#   ansible-playbook -i inventory playbook.yaml
#   ansible-playbook -i inventory playbook.yaml --tags tailscale
#   ansible-playbook -i inventory playbook.yaml -e "@/tmp/tf-outputs.json"
#
# Required extra vars (from terraform output -json):
#   ssm_activation_id       (secret)
#   ssm_activation_code     (secret)
#   ecs_cluster_name        (e.g. p-hybrid-apis)
#   aws_region              (us-east-1)
#   tailscale_auth_key      (secret, reusable)

- name: Configure Contabo VPS for hybrid architecture
  hosts: vps
  become: true
  gather_facts: true

  roles:
    - role: tailscale
      tags: [tailscale, network]

    - role: ecs-anywhere
      tags: [ecs-anywhere, agent]

    - role: traefik-multinet
      tags: [traefik, docker]
